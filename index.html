<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f7fb">
<title>INR Care</title>
<style>
:root{
  --bg:#f3f6fb;--card:#fff;--text:#182235;--muted:#7b8494;--line:#e7ebf1;
  --blue:#1769d2;--blue2:#3c86e9;--green:#1b9a62;--orange:#ef7e35;--red:#e33c4f;
  --shadow:0 10px 28px rgba(31,55,88,.07);--r:22px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px}
.page{padding:18px 18px 30px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;color:white;font-weight:900;box-shadow:var(--shadow)}
.titleWrap{flex:1}
.kicker{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:4px}
h1{margin:0;font-size:28px;line-height:1.1}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.iconBtn{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.metricLabel{font-size:14px;color:var(--muted)}
.metricValue{font-size:32px;font-weight:900}
.section{font-size:19px;font-weight:900;margin:22px 0 10px}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.btn{width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900}
.btn.out{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.soft{background:#edf4fd;color:var(--blue)}
.patient{display:flex;align-items:center;gap:14px}
.avatar{width:50px;height:50px;border-radius:16px;background:#edf3fb;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--blue)}
.patientMain{flex:1}.patientName{font-size:17px;font-weight:900}.patientMeta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.inrChip{min-width:82px;padding:10px;border-radius:18px;border:1px solid;text-align:center}
.inrChip b{display:block;font-size:24px}.inrChip small{font-size:10px;font-weight:800}
.tabs{display:flex;background:#e9eef5;padding:4px;border-radius:16px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:13px;color:var(--muted);font-weight:800}
.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 4px 16px rgba(31,55,88,.06)}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 15px;margin-bottom:12px;color:var(--text)}
.hero{text-align:center;padding:24px 16px}
.heroLabel{color:var(--muted);font-size:13px}
.heroValue{font-size:58px;font-weight:900;margin:6px 0}
.heroState{font-weight:900}
.heroTarget{color:var(--muted);font-size:12px;margin-top:6px}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.lineLabel{color:var(--muted)}.lineValue{font-weight:800}
.doses{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dose{background:#f6f8fb;border-radius:12px;padding:9px 2px;text-align:center}.dose small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.dose b{font-size:13px}
.langPanel{display:none}.langPanel.show{display:block}
.langRow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.langRow:last-child{border-bottom:0}.langRow.active{color:var(--blue);font-weight:900}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:4px}.nav .nicon{font-size:20px;display:block;margin-bottom:3px}.nav button.active{color:var(--blue)}
.roleBar{display:flex;background:#e9eef5;padding:4px;border-radius:16px;margin-bottom:14px}
.roleBar button{flex:1;border:0;background:transparent;border-radius:13px;padding:10px;font-weight:800;color:var(--muted)}
.roleBar button.active{background:#fff;color:var(--blue)}
.notice{background:#fff8e8;border:1px solid #f4df9f;border-radius:16px;padding:12px;color:#7b5a10;font-size:12px;line-height:1.7}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:25px}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:34px;height:34px;border:0;border-radius:10px;background:#edf4fd;color:var(--blue);font-size:19px;font-weight:900}.stepper span{min-width:70px;text-align:center;font-weight:900}
.statusDot{width:9px;height:9px;border-radius:50%}
.footerNote{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.6}
@media (max-width:390px){.metricValue{font-size:29px}.patientName{font-size:16px}.inrChip{min-width:76px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const T={
fa:{dir:'rtl',doctorPanel:'پنل مدیریت INR',patientPanel:'پنل بیمار',doctorName:'دکتر احمدی',newInr:'INR جدید',needsAction:'نیازمند اقدام',patients:'بیماران',messages:'پیام‌ها',recent:'بیماران اخیر',home:'خانه',more:'بیشتر',history:'تاریخچه',target:'هدف INR',weekly:'دوز هفتگی',review:'بررسی و تنظیم دوز',doctor:'پزشک',patient:'بیمار',language:'زبان',selectLang:'انتخاب زبان',doseToday:'دوز امروز',nextInr:'INR بعدی',register:'ثبت INR جدید',search:'جستجو نام یا موبایل',addPatient:'بیمار جدید',demo:'نسخه آزمایشی رابط کاربری',high:'بالاتر از هدف',low:'پایین‌تر از هدف',ok:'در محدوده هدف',urgent:'بررسی فوری',new:'جدید',reviewed:'بررسی شده',save:'ذخیره',back:'بازگشت'},
en:{dir:'ltr',doctorPanel:'INR Management',patientPanel:'Patient Portal',doctorName:'Dr. Ahmadi',newInr:'New INR',needsAction:'Needs Action',patients:'Patients',messages:'Messages',recent:'Recent Patients',home:'Home',more:'More',history:'History',target:'INR Target',weekly:'Weekly Dose',review:'Review & Adjust Dose',doctor:'Doctor',patient:'Patient',language:'Language',selectLang:'Choose language',doseToday:'Today’s dose',nextInr:'Next INR',register:'Add new INR',search:'Search name or phone',addPatient:'Add patient',demo:'UI preview version',high:'Above target',low:'Below target',ok:'In target range',urgent:'Urgent review',new:'New',reviewed:'Reviewed',save:'Save',back:'Back'},
ar:{dir:'rtl',doctorPanel:'إدارة INR',patientPanel:'بوابة المريض',doctorName:'د. أحمدي',newInr:'INR جديد',needsAction:'يحتاج إجراء',patients:'المرضى',messages:'الرسائل',recent:'المرضى الأخيرون',home:'الرئيسية',more:'المزيد',history:'السجل',target:'هدف INR',weekly:'الجرعة الأسبوعية',review:'مراجعة الجرعة',doctor:'طبيب',patient:'مريض',language:'اللغة',selectLang:'اختر اللغة',doseToday:'جرعة اليوم',nextInr:'INR القادم',register:'إضافة INR',search:'بحث بالاسم أو الهاتف',addPatient:'إضافة مريض',demo:'نسخة تجريبية للواجهة',high:'أعلى من الهدف',low:'أقل من الهدف',ok:'ضمن الهدف',urgent:'مراجعة عاجلة',new:'جديد',reviewed:'تمت المراجعة',save:'حفظ',back:'رجوع'},
tr:{dir:'ltr',doctorPanel:'INR Yönetimi',patientPanel:'Hasta Portalı',doctorName:'Dr. Ahmadi',newInr:'Yeni INR',needsAction:'İşlem Gerekli',patients:'Hastalar',messages:'Mesajlar',recent:'Son Hastalar',home:'Ana Sayfa',more:'Daha Fazla',history:'Geçmiş',target:'INR Hedefi',weekly:'Haftalık Doz',review:'Dozu Gözden Geçir',doctor:'Doktor',patient:'Hasta',language:'Dil',selectLang:'Dil seçin',doseToday:'Bugünkü doz',nextInr:'Sonraki INR',register:'Yeni INR ekle',search:'İsim veya telefon ara',addPatient:'Hasta ekle',demo:'Arayüz önizleme',high:'Hedef üstü',low:'Hedef altı',ok:'Hedef aralığında',urgent:'Acil inceleme',new:'Yeni',reviewed:'İncelendi',save:'Kaydet',back:'Geri'},
fr:{dir:'ltr',doctorPanel:'Gestion de l’INR',patientPanel:'Espace patient',doctorName:'Dr Ahmadi',newInr:'Nouvel INR',needsAction:'Action requise',patients:'Patients',messages:'Messages',recent:'Patients récents',home:'Accueil',more:'Plus',history:'Historique',target:'Cible INR',weekly:'Dose hebdomadaire',review:'Réviser la dose',doctor:'Médecin',patient:'Patient',language:'Langue',selectLang:'Choisir la langue',doseToday:'Dose du jour',nextInr:'Prochain INR',register:'Ajouter un INR',search:'Rechercher nom ou téléphone',addPatient:'Ajouter un patient',demo:'Aperçu de l’interface',high:'Au-dessus de la cible',low:'Sous la cible',ok:'Dans la cible',urgent:'Révision urgente',new:'Nouveau',reviewed:'Révisé',save:'Enregistrer',back:'Retour'},
de:{dir:'ltr',doctorPanel:'INR-Verwaltung',patientPanel:'Patientenportal',doctorName:'Dr. Ahmadi',newInr:'Neuer INR',needsAction:'Handlungsbedarf',patients:'Patienten',messages:'Nachrichten',recent:'Letzte Patienten',home:'Start',more:'Mehr',history:'Verlauf',target:'INR-Ziel',weekly:'Wochendosis',review:'Dosis prüfen',doctor:'Arzt',patient:'Patient',language:'Sprache',selectLang:'Sprache wählen',doseToday:'Heutige Dosis',nextInr:'Nächster INR',register:'INR hinzufügen',search:'Name oder Telefon suchen',addPatient:'Patient hinzufügen',demo:'UI-Vorschau',high:'Über Zielbereich',low:'Unter Zielbereich',ok:'Im Zielbereich',urgent:'Dringend prüfen',new:'Neu',reviewed:'Geprüft',save:'Speichern',back:'Zurück'}
};
const langs=[['fa','فارسی'],['en','English'],['ar','العربية'],['tr','Türkçe'],['fr','Français'],['de','Deutsch']];
const seed={role:'doctor',patients:[
{id:1,name:{fa:'علی رضایی',ar:'علي رضائي',default:'Ali Rezaei'},mobile:'09123456789',indication:{fa:'دریچه مکانیکی میترال',ar:'صمام ميترالي ميكانيكي',default:'Mechanical mitral valve'},min:2.5,max:3.5,doses:[5,5,2.5,5,5,5,2.5],history:[{v:4.1,date:'1405/07/09',reviewed:false}]},
{id:2,name:{fa:'مریم احمدی',ar:'مريم أحمدي',default:'Maryam Ahmadi'},mobile:'09351112299',indication:{fa:'فیبریلاسیون دهلیزی',ar:'رجفان أذيني',default:'Atrial fibrillation'},min:2,max:3,doses:[2.5,5,2.5,5,2.5,5,2.5],history:[{v:2.6,date:'1405/07/09',reviewed:false}]},
{id:3,name:{fa:'حسن کریمی',ar:'حسن كريمي',default:'Hasan Karimi'},mobile:'09195007766',indication:{fa:'VTE',ar:'VTE',default:'VTE'},min:2,max:3,doses:[5,5,5,2.5,5,5,2.5],history:[{v:1.7,date:'1405/07/08',reviewed:false}]}
],messages:1,currentPatientId:1};
let S=JSON.parse(localStorage.getItem('inrCareModern')||'null')||structuredClone(seed);
let lang=localStorage.getItem('inrLang')||((navigator.language||'en').slice(0,2)); if(!T[lang])lang='en';
let tab='home',route={name:'root'},tmp=[];
const A=document.getElementById('app');
function tr(k){return T[lang][k]||T.en[k]||k}
function setLang(l){lang=l;localStorage.setItem('inrLang',l);document.documentElement.dir=T[l].dir;render()}
function nm(p){return p.name[lang]||p.name.default}
function ind(p){return p.indication[lang]||p.indication.default}
function latest(p){return p.history[0]||null}
function wk(a){return a.reduce((x,y)=>x+(+y||0),0)}
function fd(n){return Number.isInteger(+n)?String(+n):(+n).toFixed(1)}
function state(p){let l=latest(p);if(!l)return['—','#8490a3'];if(l.v>=5||l.v<=1.3)return[tr('urgent'),'#e33c4f'];if(l.v<p.min)return[tr('low'),'#f59e0b'];if(l.v>p.max)return[tr('high'),'#ef7e35'];return[tr('ok'),'#1b9a62']}
function save(){localStorage.setItem('inrCareModern',JSON.stringify(S))}
function header(title,subtitle='',back=false){return `<div class="topbar">${back?`<button class="back" onclick="root()">‹</button>`:`<div class="logo">INR</div>`}<div class="titleWrap"><div class="kicker">${subtitle}</div><h1>${title}</h1></div><button class="iconBtn" onclick="toggleLang()">🌐</button></div>${langPanel()}`}
function langPanel(){return `<div id="langPanel" class="card langPanel"><div class="section" style="margin-top:0">${tr('selectLang')}</div>${langs.map(([c,n])=>`<div class="langRow ${c===lang?'active':''}" onclick="setLang('${c}')"><span>${n}</span><span>${c===lang?'✓':''}</span></div>`).join('')}</div>`}
function toggleLang(){document.getElementById('langPanel')?.classList.toggle('show')}
function roleBar(){return `<div class="roleBar"><button class="${S.role==='doctor'?'active':''}" onclick="S.role='doctor';save();tab='home';render()">${tr('doctor')}</button><button class="${S.role==='patient'?'active':''}" onclick="S.role='patient';save();tab='home';render()">${tr('patient')}</button></div>`}
function nav(items){return `<div class="nav">${items.map(([k,ic,lb])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()"><span class="nicon">${ic}</span>${lb}</button>`).join('')}</div>`}
function patientCard(p){let l=latest(p),st=state(p);return `<div class="card patient" onclick="route={name:'profile',id:${p.id}};render()"><div class="avatar">${nm(p).trim().charAt(0)}</div><div class="patientMain"><div class="patientName">${nm(p)}</div><div class="patientMeta">${ind(p)}<br>${tr('target')}: ${p.min}–${p.max}</div></div><div class="inrChip" style="color:${st[1]};border-color:${st[1]}55;background:${st[1]}12"><b>${l?l.v.toFixed(1):'—'}</b><small>${st[0]}</small></div></div>`}
function doseGrid(a){let ds=T[lang].dir==='rtl'?['ش','ی','د','س','چ','پ','ج']:['Sa','Su','Mo','Tu','We','Th','Fr'];return `<div class="card doses">${ds.map((d,i)=>`<div class="dose"><small>${d}</small><b>${fd(a[i])}</b></div>`).join('')}</div>`}
function doctorHome(){let un=S.patients.reduce((n,p)=>n+p.history.filter(x=>!x.reviewed).length,0),act=S.patients.filter(p=>state(p)[1]!=='#1b9a62').length;A.innerHTML=`<div class="page">${header(tr('doctorName'),tr('doctorPanel'))}${roleBar()}<div class="grid"><div class="card metric"><div class="metricLabel">${tr('newInr')}</div><div class="metricValue" style="color:var(--blue)">${un}</div></div><div class="card metric"><div class="metricLabel">${tr('needsAction')}</div><div class="metricValue" style="color:var(--red)">${act}</div></div><div class="card metric"><div class="metricLabel">${tr('patients')}</div><div class="metricValue">${S.patients.length}</div></div><div class="card metric"><div class="metricLabel">${tr('messages')}</div><div class="metricValue">${S.messages}</div></div></div><div class="section">${tr('recent')}</div>${S.patients.map(patientCard).join('')}<div class="footerNote">${tr('demo')}</div></div>${nav([['home','⌂',tr('home')],['patients','👥',tr('patients')],['history','●',tr('newInr')],['more','•••',tr('more')]])}`}
function patients(){A.innerHTML=`<div class="page">${header(tr('patients'),tr('doctorPanel'))}${roleBar()}<input class="inp" id="q" placeholder="${tr('search')}" oninput="filterP()"><div id="plist">${S.patients.map(patientCard).join('')}</div><button class="btn soft">${tr('addPatient')}</button></div>${nav([['home','⌂',tr('home')],['patients','👥',tr('patients')],['history','●',tr('newInr')],['more','•••',tr('more')]])}`}
function filterP(){let q=(document.getElementById('q').value||'').toLowerCase();document.getElementById('plist').innerHTML=S.patients.filter(p=>nm(p).toLowerCase().includes(q)||p.mobile.includes(q)).map(patientCard).join('')}
function profile(id){let p=S.patients.find(x=>x.id===id),l=latest(p),st=state(p);A.innerHTML=`<div class="page">${header(nm(p),tr('patients'),true)}<div class="card"><div class="line"><span class="lineValue">${p.mobile}</span><span class="lineLabel">${tr('patients')}</span></div><div class="line"><span class="lineValue">${p.min}–${p.max}</span><span class="lineLabel">${tr('target')}</span></div><div class="line"><span class="lineValue">${fd(wk(p.doses))} mg</span><span class="lineLabel">${tr('weekly')}</span></div></div><div class="card hero" style="background:${st[1]}0f;border-color:${st[1]}38"><div class="heroLabel">${tr('newInr')}</div><div class="heroValue" style="color:${st[1]}">${l?l.v.toFixed(1):'—'}</div><div class="heroState" style="color:${st[1]}">${st[0]}</div><div class="heroTarget">${tr('target')}: ${p.min}–${p.max}</div></div><div class="section">${tr('weekly')}</div>${doseGrid(p.doses)}<button class="btn" onclick="route={name:'review',id:${p.id}};render()">${tr('review')}</button></div>`}
function review(id){let p=S.patients.find(x=>x.id===id);tmp=[...p.doses];A.innerHTML=`<div class="page">${header(tr('review'),nm(p),true)}<div class="notice">${tr('demo')}</div><div class="section">${tr('weekly')}</div><div id="doseEdit"></div><div class="card"><div class="line"><span id="sum" class="lineValue">${fd(wk(tmp))} mg</span><span class="lineLabel">${tr('weekly')}</span></div></div><button class="btn" onclick="approve(${id})">${tr('save')}</button></div>`;doseEdit()}
function doseEdit(){let ds=['1','2','3','4','5','6','7'];document.getElementById('doseEdit').innerHTML=tmp.map((v,i)=>`<div class="card line"><div class="stepper"><button onclick="adj(${i},-.5)">−</button><span>${fd(v)} mg</span><button onclick="adj(${i},.5)">+</button></div><span class="lineLabel">${ds[i]}</span></div>`).join('');document.getElementById('sum').textContent=fd(wk(tmp))+' mg'}
function adj(i,d){tmp[i]=Math.max(0,Math.round((tmp[i]+d)*2)/2);doseEdit()}
function approve(id){let p=S.patients.find(x=>x.id===id);p.doses=[...tmp];if(p.history[0])p.history[0].reviewed=true;save();route={name:'profile',id};render()}
function patientHome(){let p=S.patients.find(x=>x.id===S.currentPatientId)||S.patients[0],l=latest(p),st=state(p);A.innerHTML=`<div class="page">${header(nm(p),tr('patientPanel'))}${roleBar()}<div class="card hero" style="background:${st[1]}0f;border-color:${st[1]}38"><div class="heroLabel">${tr('newInr')}</div><div class="heroValue" style="color:${st[1]}">${l?l.v.toFixed(1):'—'}</div><div class="heroState" style="color:${st[1]}">${st[0]}</div><div class="heroTarget">${tr('target')}: ${p.min}–${p.max}</div></div><div class="card"><div class="line"><span class="lineValue">${fd(p.doses[0])} mg</span><span class="lineLabel">${tr('doseToday')}</span></div><div class="line"><span class="lineValue">—</span><span class="lineLabel">${tr('nextInr')}</span></div></div><button class="btn">${tr('register')}</button><div class="section">${tr('weekly')}</div>${doseGrid(p.doses)}</div>${nav([['home','⌂',tr('home')],['history','≋',tr('history')],['messages','✉',tr('messages')],['more','•••',tr('more')]])}`}
function more(){A.innerHTML=`<div class="page">${header(tr('more'),tr('language'))}${roleBar()}<div class="card">${langs.map(([c,n])=>`<div class="langRow ${c===lang?'active':''}" onclick="setLang('${c}')"><span>${n}</span><span>${c===lang?'✓':''}</span></div>`).join('')}</div></div>${nav(S.role==='doctor'?[['home','⌂',tr('home')],['patients','👥',tr('patients')],['history','●',tr('newInr')],['more','•••',tr('more')]]:[['home','⌂',tr('home')],['history','≋',tr('history')],['messages','✉',tr('messages')],['more','•••',tr('more')]])}`}
function root(){route={name:'root'};render()}
function render(){document.documentElement.dir=T[lang].dir;document.documentElement.lang=lang;if(route.name==='profile')return profile(route.id);if(route.name==='review')return review(route.id);if(S.role==='doctor'){if(tab==='home')return doctorHome();if(tab==='patients')return patients();return more()}else{if(tab==='home')return patientHome();return more()}}
render();
</script>
</body></html>
